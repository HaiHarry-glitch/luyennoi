    <main class="main">

      <form id="uq-form" class="form-row" onsubmit="return false;">
        <input id="uq-input" class="form-input" type="text" placeholder="Nháº­p cÃ¢u há»i cá»§a báº¡n vÃ o Ä‘Ã¢y..." maxlength="300" required>
        <select id="uq-part" class="form-select">
          <option value="1">Part 1</option>
          <option value="2">Part 2</option>
          <option value="3">Part 3</option>
        </select>
        <button id="uq-add" class="btn-add" type="submit">ThÃªm CÃ¢u há»i</button>

  <script src="/real-overlay.js"></script>
  <script>
    (function() {
      const KEY = "ln.userQuestions";
      function load() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } }
      function save(arr) { localStorage.setItem(KEY, JSON.stringify(arr)); }
      function render() {
        const list = document.getElementById("uq-list");
        const items = load();
        if (!items.length) {
          list.innerHTML = '<div class="empty">ChÆ°a cÃ³ cÃ¢u há»i nÃ o. HÃ£y thÃªm cÃ¢u há»i Ä‘áº§u tiÃªn cá»§a báº¡n!</div>';
          return;
        }
        list.innerHTML = items.map((q, i) => `
          <div class="q-card" data-idx="${i}">
            <div class="q-text">${q.text.replace(/</g,"&lt;")}</div>
            <div class="q-meta">
              <span class="q-part">PART ${q.part}</span>
              <button class="q-del" data-del="${i}" type="button">XoÃ¡</button>
            </div>
          </div>`).join("");
        // Wire clicks
        list.querySelectorAll(".q-card").forEach(card => {
          card.addEventListener("click", (e) => {
            if (e.target.dataset.del !== undefined) return;
            const idx = +card.dataset.idx;
            const q = load()[idx];
            location.href = `/question-answer/PART%20${q.part}~${encodeURIComponent(q.text)}`;
          });
        });
        list.querySelectorAll("[data-del]").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = +btn.dataset.del;
            const arr = load();
            arr.splice(idx, 1);
            save(arr);
            render();
          });
        });
      }
      document.getElementById("uq-form").addEventListener("submit", () => {
        const text = document.getElementById("uq-input").value.trim();
        const part = document.getElementById("uq-part").value;
        if (!text) return false;
        const arr = load();
        arr.unshift({ text, part, ts: Date.now() });
        save(arr);
        document.getElementById("uq-input").value = "";
        render();
        return false;
      });
      render();
    })();
  </script>
