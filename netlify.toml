[build]
  publish = "public"
  command = "npm run export:netlify"
  functions = "netlify/functions"

[functions."api"]
  # Allow long-running audio scoring calls to Gemini (Part 2 ~ 2 min audio).
  # Pro plans honour up to 26 s; free tier is capped at 10 s.
  timeout = 26

[functions."score-speaking-background"]
  timeout = 900

[[redirects]]
  from = "/favicon.ico"
  to = "/real/favicon.ico"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/real/apple-touch-icon-iphone-retina-120x120.png"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/real/favicon.svg"
  status = 200

[[redirects]]
  from = "/api/gemini/score-speaking/background"
  to = "/.netlify/functions/score-speaking-background"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/question-answer/PART*"
  to = "/question-answer/detail.html"
  status = 200

[[redirects]]
  from = "/question-answer/part*"
  to = "/question-answer/detail.html"
  status = 200

[[redirects]]
  from = "/alphafeature/pronun/lesson*"
  to = "/alphafeature/pronun/index.html"
  status = 200

[[redirects]]
  from = "/reading"
  to = "/reading/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reading/"
  to = "/reading/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/reading/*"
  to = "/reading/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/home/?openUserModal=1"
  status = 302
  force = true

[[redirects]]
  from = "/settings/"
  to = "/home/?openUserModal=1"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
